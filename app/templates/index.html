<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CaneCCS Predictor</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:480px;margin:40px auto;padding:0 16px;background:#f6faf3;color:#1d2b1a}
 h1{font-size:1.4rem} label{display:block;margin-top:10px;font-size:.9rem}
 input,select{width:100%;padding:7px;border:1px solid #b7cdb0;border-radius:6px}
 button{margin-top:16px;padding:10px 16px;background:#2e7d32;color:#fff;border:0;border-radius:6px;cursor:pointer}
 #out{margin-top:18px;padding:12px;background:#e4f1de;border-radius:8px;min-height:24px}
 small{color:#55704f}
</style></head><body>
<h1>CaneCCS Predictor</h1>
<small>Predicts Commercial Cane Sugar % of a sugarcane batch. Model v{{ meta.model_version }}.</small>
<label>Variety<select id="variety">{% for v in varieties %}<option>{{ v }}</option>{% endfor %}</select></label>
<label>Brix<input id="brix" type="number" step="0.1" value="19.5"></label>
<label>Pol<input id="pol" type="number" step="0.1" value="17.2"></label>
<label>Fibre %<input id="fibre_pct" type="number" step="0.1" value="13.5"></label>
<label>Trash %<input id="trash_pct" type="number" step="0.1" value="2.5"></label>
<label>Days since harvest<input id="days" type="number" value="1"></label>
<button onclick="go()">Predict CCS</button>
<div id="out"></div>
<script>
async function go(){
 const g=id=>document.getElementById(id).value;
 const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({variety:g('variety'),brix:g('brix'),pol:g('pol'),fibre_pct:g('fibre_pct'),
  trash_pct:g('trash_pct'),days_since_harvest:g('days')})});
 const d=await r.json();
 document.getElementById('out').textContent=r.ok?`CCS = ${d.ccs}%  |  Grade ${d.grade}`:`Error: ${d.error}`;
}
</script></body></html>
